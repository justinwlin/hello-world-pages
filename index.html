<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, world</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px; box-sizing: border-box; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f7f7f5; color: #1f2328;
  }
  h1 { font-size: clamp(2.25rem, 8vw, 4.5rem); margin: 0 0 0.4em; letter-spacing: -0.02em; }
  p { margin: 0.3em 0; font-size: 1.1rem; color: #57606a; }
  .date { font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    p { color: #9198a1; }
  }
</style>
</head>
<body>
  <main>
    <h1>Hello, world 👋</h1>
    <p>Built by an agent driven from Hermes via herdr.</p>
    <p class="date">Build date: <time datetime="2026-11-18">2026-11-18</time></p>
  </main>
</body>
</html>
